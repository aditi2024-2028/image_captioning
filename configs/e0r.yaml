run_name: e0r
seed: 42
output_dir: outputs/e0r
data:
  train_image_dir: /kaggle/input/datasets/adityajn105/flickr8k/Images
  val_image_dir: /kaggle/input/datasets/adityajn105/flickr8k/Images
  train_ann_file: /kaggle/input/datasets/adityajn105/flickr8k/captions.txt
  val_ann_file: /kaggle/input/datasets/adityajn105/flickr8k/captions.txt
  image_size: 224
  max_captions_per_image: 5
  num_workers: 2
  pin_memory: true
model:
  clip_model_name: openai/clip-vit-base-patch16
  bart_model_name: facebook/bart-base
  proj_dim: 768
  adapter_bottleneck_dim: 64
training:
  num_epochs: 5
  batch_size: 4
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  amp: true
  optimizer:
    type: adamw
    lr: 0.0001
    weight_decay: 0.01
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  scheduler:
    type: cosine_with_warmup
    warmup_steps: 100
  freeze_stages:
  - epoch_start: 1
    epoch_end: 2
    clip_frozen: true
    bart_trainable_parts:
    - cross_attention
    clip_top_vision_layers: 0
    clip_post_layernorm: false
  - epoch_start: 3
    epoch_end: 4
    clip_frozen: true
    bart_trainable_parts:
    - cross_attention
    - top2_decoder_layers
    clip_top_vision_layers: 0
    clip_post_layernorm: false
  - epoch_start: 5
    epoch_end: 5
    clip_frozen: false
    bart_trainable_parts:
    - cross_attention
    - top2_decoder_layers
    clip_top_vision_layers: 3
    clip_post_layernorm: true
checkpoint:
  save_every_epoch: true
  keep_last_n: 5
  filename_pattern: ckpt_epoch{epoch:02d}.pt
  best_metric: cider
eval:
  batch_size: 4
  beam_size: 4
  max_new_tokens: 30
  min_length: 5
  length_penalty: 1.0
  no_repeat_ngram_size: 3
  predictions_file: outputs/e0r/predictions.json
  annotations_file: outputs/e0r/flickr8k_coco.json
kaggle:
  dataset_owner: add2026
  dataset_slug: e0r-checkpoints
  local_ckpt_dir: outputs/e0r
